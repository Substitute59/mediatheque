Vous ne trouvez pas le tag souhaité dans la liste ? <p-button variant="text" (click)="visible = true" i18n="@@media.details.tag.add">Ajouter un tag</p-button>
<p-dialog i18n-header="@@media.details.tag.add" header="Ajouter un tag" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <div class="flex flex-col gap-4 mb-8">
        @for (nameField of names; let i = $index; track i) {
            <div class="flex flex-col gap-1">
                <label class="font-semibold" i18n="@@media.tag.add.name">Nom*</label>

                <input pInputText
                       [(ngModel)]="names[i]"
                       type="text"
                       class="w-full px-3 py-2 shadow-sm rounded-lg"
                       i18n-placeholder="@@media.tag.add.placeholder.name"
                       placeholder="Nom" />

                @if (errors[i]) {
                    <p class="text-sm text-red-500">{{ errors[i] }}</p>
                }
            </div>
        }

        <p-button variant="text"
                  i18n-label="@@tag.add.more"
                  label="Ajouter un autre tag"
                  icon="pi pi-plus"
                  (click)="addField()">
        </p-button>
    </div>
    <div class="flex justify-end gap-2">
        <p-button i18n-label="@@media.tag.add.cancel" label="Annuler" severity="secondary" (click)="visible = false" />
        <p-button i18n-label="@@media.tag.add.save" label="Valider" (click)="addTag()" />
    </div>
    @if (errorMessage !== '') {
        <p class="w-full text-sm text-red-500 mt-2">{{ errorMessage }}</p>
    }
</p-dialog>
