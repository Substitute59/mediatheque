Vous ne trouvez pas la plateforme souhaitée dans la liste ? <p-button variant="text" (click)="visible = true" i18n="@@media.details.platform.add">Ajouter une plateforme</p-button>
<p-dialog i18n-header="@@media.details.platform.add" header="Ajouter une plateforme" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <div class="flex flex-col gap-4 mb-8">
        <label for="name" class="font-semibold" i18n="@@media.platform.add.name">Nom*</label>
        <input pInputText id="name" name="name" [(ngModel)]="name" type="name" required i18n-placeholder="@@media.platform.add.placeholder.name" placeholder="Nom" class="w-full px-3 py-2 shadow-sm rounded-lg" />
        @if (errorName !== '') {
            <p class="w-full text-sm text-red-500">{{ errorName }}</p>
        }
    </div>
    <div class="flex justify-end gap-2">
        <p-button i18n-label="@@media.platform.add.cancel" label="Annuler" severity="secondary" (click)="visible = false" />
        <p-button i18n-label="@@media.platform.add.save" label="Valider" (click)="addPlatform()" />
    </div>
    @if (errorMessage !== '') {
        <p class="w-full text-sm text-red-500 mt-2">{{ errorMessage }}</p>
    }
</p-dialog>
<p-blockUI [blocked]="loading">
    <p-progressSpinner></p-progressSpinner>
</p-blockUI>
