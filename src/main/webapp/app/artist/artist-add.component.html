Vous ne trouvez pas l'artiste souhaité dans la liste ? <p-button variant="text" (click)="visible = true" i18n="@@media.details.artist.add">Ajouter un artiste</p-button>
<p-dialog i18n-header="@@media.details.artist.add" header="Ajouter un artiste" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <div class="flex flex-col gap-4 mb-8">
        <label for="name" class="font-semibold" i18n="@@media.artist.add.name">Nom*</label>
        <input pInputText id="name" name="name" [(ngModel)]="name" type="name" required i18n-placeholder="@@media.artist.add.placeholder.name" placeholder="Nom" class="w-full px-3 py-2 shadow-sm rounded-lg" />
        @if (errorName !== '') {
            <p class="w-full text-sm text-red-500">{{ errorName }}</p>
        }
    </div>
    <div class="flex flex-col gap-4 mb-8">
        <label for="type" class="font-semibold" i18n="@@media.artist.add.type">Type : auteur, studio de développement, chanteur, groupe, ...*</label>
        <input pInputText id="type" name="type" [(ngModel)]="type" type="type" required i18n-placeholder="@@media.artist.add.placeholder.type" placeholder="Type : auteur, studio de développement, chanteur, groupe, ..." class="w-full px-3 py-2 shadow-sm rounded-lg" />
        @if (errorType !== '') {
            <p class="w-full text-sm text-red-500">{{ errorType }}</p>
        }
    </div>
    <div class="flex justify-end gap-2">
        <p-button i18n-label="@@media.artist.add.cancel" label="Annuler" severity="secondary" (click)="visible = false" />
        <p-button i18n-label="@@media.artist.add.save" label="Valider" (click)="addArtist()" />
    </div>
    @if (errorMessage !== '') {
        <p class="w-full text-sm text-red-500 mt-2">{{ errorMessage }}</p>
    }
</p-dialog>
